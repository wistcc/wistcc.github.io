<script>
/* Recall: script de la página compartida (va en línea dentro de la página; sin módulos ni dependencias).
   Descifra en el navegador con WebCrypto usando la clave del #fragmento (o la que se pegue en "Contraseña")
   y pinta el contenido. Todo texto se escapa antes de entrar al HTML. Las pruebas corren este mismo archivo
   en Node (globalThis.crypto.subtle). Nota: sin secuencias de dos puntos-palabra-dos puntos (las
   convertiría jemoji en el sitio Jekyll). */
'use strict';
var RecallPage = (function () {
  var AAD_PREFIX = 'recall-share-v1:';

  function b64uToBytes(s) {
    s = String(s).replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  /* Acepta la clave sola o el link completo pegado (toma lo que va después de "#"). */
  function cleanKey(input) {
    var s = String(input == null ? '' : input).trim();
    var h = s.indexOf('#');
    if (h >= 0) s = s.slice(h + 1);
    try { s = decodeURIComponent(s); } catch (e) { /* tal cual */ }
    return /^[A-Za-z0-9_-]{43}$/.test(s) ? s : null;
  }

  async function decrypt(payload, keyInput, id) {
    var key = cleanKey(keyInput);
    if (!key) throw new Error('clave');
    var raw = b64uToBytes(payload);
    if (raw.length < 12 + 16) throw new Error('datos');
    var k = await crypto.subtle.importKey('raw', b64uToBytes(key), { name: 'AES-GCM' }, false, ['decrypt']);
    var pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: raw.slice(0, 12), additionalData: new TextEncoder().encode(AAD_PREFIX + id), tagLength: 128 },
      k, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(pt));
  }

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  /* En línea: escapa primero y luego solo agrega etiquetas fijas (negrita, cursiva, código). */
  function inline(s) {
    return esc(s)
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[\s(])\*([^*\s][^*]*?)\*(?=[\s).,;!?]|$)/g, '$1<em>$2</em>');
  }

  /* Markdown mínimo: títulos, viñetas, listas numeradas, citas, líneas horizontales y párrafos. */
  function mdToHtml(md) {
    var lines = String(md == null ? '' : md).split(/\r?\n/);
    var out = [];
    var list = null;
    function close() { if (list) { out.push('</' + list + '>'); list = null; } }
    function open(tag) { if (list !== tag) { close(); out.push('<' + tag + '>'); list = tag; } }
    for (var i = 0; i < lines.length; i++) {
      var raw = lines[i];
      var l = raw.trim();
      var m;
      if (!l) { close(); continue; }
      if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) {
        close();
        var level = m[1].length <= 2 ? 3 : 4;
        out.push('<h' + level + '>' + inline(m[2]) + '</h' + level + '>');
      } else if (/^([-*_])(\s*\1){2,}$/.test(l)) {
        close(); out.push('<hr>');
      } else if ((m = /^[-*•+]\s+(.*)$/.exec(l))) {
        open('ul');
        out.push('<li' + (/^\s{2,}/.test(raw) ? ' class="sub"' : '') + '>' + inline(m[1]) + '</li>');
      } else if ((m = /^\d+[.)]\s+(.*)$/.exec(l))) {
        open('ol'); out.push('<li>' + inline(m[1]) + '</li>');
      } else if ((m = /^>\s?(.*)$/.exec(l))) {
        close(); out.push('<blockquote>' + inline(m[1]) + '</blockquote>');
      } else {
        close(); out.push('<p>' + inline(l) + '</p>');
      }
    }
    close();
    return out.join('\n');
  }

  function render(data) {
    var d = data || {};
    var parts = ['<header>', '<h1>' + esc(d.title || 'Sin título') + '</h1>'];
    if (d.info) parts.push('<p class="meta">' + esc(d.info) + '</p>');
    parts.push('</header>', '<section>', '<h2>Resumen</h2>', mdToHtml(d.summary), '</section>');
