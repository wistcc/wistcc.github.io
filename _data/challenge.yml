# ============================================================================
#  THE CHALLENGE — SINGLE SOURCE OF TRUTH
#  "Intentando reemplazar mi sueldo, una hora a la vez."
#
#  Edita SOLO este archivo para actualizar el reto. Nada está hardcodeado en
#  la UI. Las páginas /challenge/ y /challenge/journey/ leen todo desde aquí.
#
#  ⚠️  PLACEHOLDER = valor de ejemplo. Reemplázalo por datos reales.
#      Los montos NO son reales: confírmalos antes de publicar.
# ============================================================================

config:
  # --- Estado del reto ---
  current_day: 20                 # Día actual del reto (actualízalo a diario)
  start_date: 2026-08-31          # Fecha de inicio del reto

  # --- Dinero ---
  currency: "RD$"                 # Prefijo de moneda
  total_generated: 0              # Todo lo generado fuera del trabajo durante el reto (hoy: 0)
  monthly_income: 0               # Ingreso recurrente que NO depende directamente de cada hora (hoy: 0)
  target_monthly_income: 150000   # ⚠️ PLACEHOLDER — pon aquí tu sueldo real a reemplazar

  # Instagram y foto de retrato ahora viven en _data/profile.yml (compartidos por todo el sitio).

  # --- Enfoque actual (cambia con frecuencia) ---
  current_focus: >-
    Demostrar que KASSO crea valor real para nuestros primeros clientes antes
    de empezar a crecer agresivamente.

# ============================================================================
#  HISTÓRICO DE INGRESO MENSUAL (para el gráfico)
#  Agrega un punto cada vez que el ingreso mensual cambie de forma relevante.
#  ⚠️ PLACEHOLDER — reemplaza por los valores reales de tu histórico.
# ============================================================================
income_history:
  - { day: 1,  date: 2026-08-31, monthly_income: 0 }
  - { day: 20, date: 2026-09-19, monthly_income: 0 }
  # Agrega un punto nuevo cuando el ingreso mensual cambie, ej:
  # - { day: 30, date: 2026-09-29, monthly_income: 1500 }

# ============================================================================
#  LO QUE ESTOY CONSTRUYENDO  (1–3 proyectos relevantes)
#  status: active | paused | closed
# ============================================================================
projects:
  - name: "KASSO"
    status: "active"
    tagline: "Cobros con IA para empresas"
    description: >-
      KASSO utiliza inteligencia artificial para ayudar a empresas a cobrar
      dinero pendiente y automatizar gran parte del seguimiento de cobros.
    why: >-
      El trabajo de seguimiento de cobros es repetitivo y hoy lo hace el bot,
      no yo. Eso lo convierte en una fuente de ingreso que puede crecer sin
      depender directamente de cada hora de mi tiempo.
    link: ""                      # Opcional: URL del proyecto (vacío = sin botón)
    metrics:
      - "En uso con clientes reales"
      - "El bot ya maneja +100 conversaciones al día"
      - "Cobró RD$66,552 de manera autónoma (Día 20)"
      - "Primer empleado del equipo"

