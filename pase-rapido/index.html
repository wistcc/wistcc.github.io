<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
<style>
  :root{
    --green:#1f9d55; --green-deep:#0f5c33; --green-dark:#0a3d22; --lime:#7CE49B;
    --ink:#0f241a; --muted:#5d6d63; --line:#e3e6df; --card:#ffffff;
    --bg:#f5f6f1; --bg2:#eef1ea; --bad:#d1495b; --shadow:0 20px 46px -22px rgba(10,61,34,.4);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    font-family:"Manrope",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(120% 60% at 50% -5%, rgba(31,157,85,.14), transparent 60%),
      var(--bg);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-top:env(safe-area-inset-top,0px);
  }
  a{color:var(--green-deep);text-decoration:none;font-weight:700}
  .wrap{max-width:1040px;margin:0 auto;padding-inline:18px}
  .center{text-align:center}

  /* top bar */
  .top{display:flex;align-items:center;gap:12px;padding:16px 18px;max-width:1040px;margin:0 auto;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:9px}
  .mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(160deg,var(--green),var(--green-deep));display:grid;place-items:center;flex:0 0 auto}
  .brand b{font-size:.9rem;letter-spacing:.02em;line-height:1}
  .brand small{display:block;font-size:.58rem;letter-spacing:.26em;color:var(--muted);font-weight:700}
  .top .sp{flex:1}
  .disc{font-size:.62rem;color:var(--muted);max-width:280px;line-height:1.35}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
  .lang button{border:0;background:transparent;font:inherit;font-weight:700;font-size:.74rem;padding:6px 11px;cursor:pointer;color:var(--muted)}
  .lang button[aria-pressed="true"]{background:var(--green-deep);color:#fff}

  /* hero */
  .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:34px;align-items:center;padding:26px 0 44px}
  @media(max-width:820px){.hero{grid-template-columns:1fr;gap:24px;text-align:center;padding-top:12px}}
  .eyebrow{font-size:.66rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green);margin-bottom:14px}
  h1{font-size:2.5rem;line-height:1.05;letter-spacing:-.025em;margin:0 0 16px;text-wrap:balance}
  @media(max-width:820px){h1{font-size:2rem}}
  .lead{font-size:1.06rem;color:#374b40;max-width:34ch;margin:0 0 20px}
  @media(max-width:820px){.lead{margin-inline:auto}}
  .hint{display:inline-flex;align-items:center;gap:8px;font-size:.82rem;font-weight:700;color:var(--green-deep);background:rgba(31,157,85,.1);padding:9px 14px;border-radius:999px}
  .herophone{display:flex;justify-content:center}

  /* sections */
  section{padding:44px 0;border-top:1px solid var(--line)}
  .sechead{max-width:640px;margin:0 auto 26px;text-align:center}
  .sechead .eyebrow{margin-bottom:8px}
  h2{font-size:1.7rem;letter-spacing:-.02em;margin:0 0 8px;text-wrap:balance}
  .sechead p{color:var(--muted);margin:0}

  /* process compare */
  .cmp{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:760px){.cmp{grid-template-columns:1fr}}
  .flow{border-radius:18px;padding:20px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow)}
  .flow.good{background:linear-gradient(165deg,rgba(31,157,85,.09),var(--card));border-color:rgba(31,157,85,.4)}
  .flowhead{display:flex;align-items:center;gap:9px;margin-bottom:16px;flex-wrap:wrap}
  .tag{font-size:.62rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px;border-radius:999px}
  .tag.bad{background:rgba(209,73,91,.13);color:var(--bad)}
  .tag.ok{background:rgba(31,157,85,.15);color:var(--green-deep)}
  .flowhead b{font-size:.78rem;color:var(--muted)}
  .steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:13px}
  .steps li{position:relative;padding-left:32px;font-size:.86rem;counter-increment:s;display:flex;gap:10px;align-items:flex-start}
  .steps .stx{flex:1}
  .steps .t{flex:0 0 auto;font-size:.64rem;font-weight:800;color:var(--muted);background:var(--bg2);padding:3px 8px;border-radius:999px;white-space:nowrap;margin-top:1px}
  .flow.good .steps .t{background:rgba(31,157,85,.16);color:var(--green-deep)}
  .steps li::before{content:counter(s);position:absolute;left:0;top:-1px;width:22px;height:22px;border-radius:50%;background:var(--bg2);color:var(--ink);font-size:.68rem;font-weight:800;display:grid;place-items:center}
  .flow.good .steps li::before{background:var(--green);color:#fff}
  .steps em{display:block;font-style:normal;font-size:.78rem;margin-top:4px;font-weight:700;line-height:1.35}
  .warn{color:var(--bad)} .warn::before{content:"⚠ "}
  .ok2{color:var(--green-deep)} .ok2::before{content:"✓ "}
  .flowfoot{margin-top:16px;padding-top:13px;border-top:1px solid var(--line);font-size:.78rem;font-weight:800;line-height:1.4}
  .flowfoot.bad{color:var(--bad)} .flowfoot.good{color:var(--green-deep)}

  /* safety cards */
  .cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  @media(max-width:860px){.cards{grid-template-columns:1fr 1fr}}
  @media(max-width:520px){.cards{grid-template-columns:1fr}}
  .scard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px}
  .scard .em{font-size:1.5rem}
  .scard h3{font-size:.98rem;margin:10px 0 6px}
  .scard p{font-size:.82rem;color:var(--muted);margin:0}

  /* tech */
  .tech{max-width:720px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:8px 22px}
  .tech details{border-bottom:1px solid var(--line)}
  .tech details:last-child{border-bottom:0}
  .tech summary{cursor:pointer;font-weight:800;font-size:.95rem;padding:16px 0;list-style:none;display:flex;align-items:center;gap:10px}
  .tech summary::-webkit-details-marker{display:none}
  .tech summary::before{content:"+";color:var(--green);font-size:1.2rem;width:16px}
  .tech details[open] summary::before{content:"–"}
  .tech .body{padding:0 0 18px 26px;font-size:.86rem;color:#374b40}
  .tech .body li{margin-bottom:7px}

  /* contact */
  .contact{max-width:660px;margin:0 auto;text-align:center}
  .contact p{color:#374b40}
  .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:20px}
  .btn{display:inline-flex;align-items:center;gap:8px;border-radius:13px;padding:13px 20px;font-weight:800;font-size:.92rem;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
  .btn.primary{background:linear-gradient(180deg,var(--green),var(--green-deep));color:#fff;border-color:transparent;box-shadow:0 10px 22px -10px rgba(15,92,51,.7)}

  footer{border-top:1px solid var(--line);padding:26px 18px 40px;text-align:center;color:var(--muted);font-size:.72rem;line-height:1.5;padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
  footer .wrap{max-width:640px}

  /* ===== phone (interactive) ===== */
  .phone{width:320px;max-width:100%;background:#0a3d22;border-radius:40px;padding:11px;box-shadow:var(--shadow),0 0 0 1px rgba(255,255,255,.05) inset}
  .screen{background:#f3f1ea;border-radius:30px;overflow:hidden;min-height:560px;display:flex;flex-direction:column;position:relative;color:#12241b}
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:12px 20px 4px;font-size:.72rem;font-weight:700}
  .statusbar .d{display:flex;gap:4px}.statusbar .d span{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.7}
  .appbar{display:flex;align-items:center;gap:9px;padding:6px 18px 10px}
  .appbar .mark{width:28px;height:28px;border-radius:8px}
  .appbar b{font-size:.8rem;line-height:1}.appbar small{display:block;font-size:.55rem;letter-spacing:.26em;color:var(--muted);font-weight:700}
  .ptabs{display:flex;gap:2px;padding:0 18px 6px}
  .ptabs button{flex:1;border:0;background:transparent;font:inherit;font-weight:700;font-size:.76rem;padding:8px;border-radius:10px;color:var(--muted);cursor:pointer}
  .ptabs button[aria-selected="true"]{background:#fff;color:var(--green-deep);box-shadow:0 2px 8px -4px rgba(0,0,0,.2)}
  .pview{flex:1;padding:8px 18px 20px;display:none;flex-direction:column;gap:12px}
  .pview.active{display:flex}
  .pk{font-size:.6rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green)}
  .ph{font-size:1.2rem;font-weight:800;letter-spacing:-.02em;margin:0}
  .psub{font-size:.8rem;color:var(--muted);margin:0;line-height:1.45}
  .order{display:flex;align-items:center;gap:11px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:12px}
  .order .ic{width:38px;height:38px;border-radius:11px;background:rgba(31,157,85,.12);display:grid;place-items:center;flex:0 0 auto;font-size:1.1rem}
  .order b{font-size:.85rem;display:block}.order span{font-size:.72rem;color:var(--muted)}
  .pfield{display:flex;flex-direction:column;gap:5px}
  .pfield label{font-size:.72rem;font-weight:700}.pfield label span{color:var(--muted);font-weight:500}
  .pfield input{font:inherit;font-size:.84rem;padding:11px;border-radius:11px;border:1px solid var(--line);background:#fff}
  .pfield input:focus{outline:2px solid var(--green);outline-offset:1px}
  .pnote{font-size:.72rem;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:11px;padding:10px 12px;line-height:1.45}
  .pnote b{color:var(--ink)}
  .pbtn{border:0;border-radius:13px;padding:14px;font:inherit;font-weight:800;font-size:.9rem;cursor:pointer;width:100%}
  .pbtn.primary{background:linear-gradient(180deg,var(--green),var(--green-deep));color:#fff}
  .pbtn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:700}
  .pbtn.danger{background:transparent;color:var(--bad);border:1px solid var(--bad);font-weight:700}
  .psp{flex:1}
  .pill{font-size:.62rem;font-weight:800;color:var(--green-deep);background:rgba(31,157,85,.12);padding:4px 8px;border-radius:999px;margin-left:auto;white-space:nowrap}

  .pass{position:relative;border-radius:20px;overflow:hidden;background:linear-gradient(155deg,#0f5c33,#0a3d22 70%);color:#fff;padding:15px;touch-action:none}
  .pass::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(124,228,155,.32) 48%,rgba(255,255,255,.08) 52%,transparent 70%);transform:translateX(-120%);animation:sweep 2.6s linear infinite;pointer-events:none}
  @keyframes sweep{to{transform:translateX(120%)}}
  .pass .top{display:flex;align-items:center;gap:8px;position:relative;z-index:1}
  .plive{display:inline-flex;align-items:center;gap:6px;font-size:.58rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;background:rgba(124,228,155,.16);color:var(--lime);padding:4px 9px;border-radius:999px}
  .beat{width:7px;height:7px;border-radius:50%;background:var(--lime);box-shadow:0 0 0 0 rgba(124,228,155,.7);animation:beat 1.2s ease-out infinite}
  @keyframes beat{70%{box-shadow:0 0 0 8px rgba(124,228,155,0)}100%{box-shadow:0 0 0 0 rgba(124,228,155,0)}}
  .pass .clk{margin-left:auto;font-size:.66rem;font-variant-numeric:tabular-nums;opacity:.85;position:relative;z-index:1}
  .qrwrap{position:relative;z-index:1;display:flex;justify-content:center;margin:12px 0 6px}
  .qr{background:#fff;border-radius:14px;padding:9px;display:grid;grid-template-columns:repeat(25,1fr);width:150px;height:150px}
  .qr i{background:#0a3d22}
  .ring{position:relative;z-index:1;display:flex;align-items:center;gap:11px;margin-top:2px}
  .ring .prog{stroke:var(--lime);stroke-linecap:round;transition:stroke-dashoffset 1s linear}
  .ring .track{stroke:rgba(255,255,255,.18)}
  .ptime{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ptime small{display:block;font-size:.56rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  .seccode{margin-left:auto;text-align:right}.seccode b{font-size:.98rem;font-variant-numeric:tabular-nums;letter-spacing:.14em;display:block}
  .seccode small{font-size:.52rem;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
  .pmeta{position:relative;z-index:1;margin-top:13px;border-top:1px solid rgba(255,255,255,.14);padding-top:11px;display:grid;grid-template-columns:1fr 1fr;gap:9px;font-size:.72rem}
  .pmeta span{display:block;opacity:.65;font-size:.58rem;letter-spacing:.05em;text-transform:uppercase;margin-bottom:2px}
  .swipehint{position:relative;z-index:1;text-align:center;font-size:.58rem;letter-spacing:.1em;text-transform:uppercase;color:var(--lime);opacity:.85;margin-top:11px}
  .trail{position:absolute;width:9px;height:9px;border-radius:50%;background:radial-gradient(circle,#fff,var(--lime) 60%,transparent);pointer-events:none;z-index:3;transform:translate(-50%,-50%);animation:trail .7s ease-out forwards}
  @keyframes trail{0%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-150%) scale(.3)}}
  .pass.dead{background:linear-gradient(155deg,#3a3f3c,#2a2f2c)}.pass.dead::after{display:none}
  .expired{position:relative;z-index:2;text-align:center;padding:26px 6px}

  .context{font-size:.9rem;color:var(--muted);max-width:42ch;margin:0 0 14px}
  @media(max-width:820px){.context{margin-inline:auto}}
  .stat{display:inline-block;font-size:.92rem;font-weight:800;color:var(--green-deep);background:rgba(31,157,85,.1);border:1px solid rgba(31,157,85,.28);padding:10px 14px;border-radius:12px;margin:0 0 18px}
  .notproduct{font-size:.72rem;color:var(--muted);margin:14px 0 0}
  .quoteband{background:var(--green-deep);color:#fff}
  .quoteband .wrap{padding-block:38px}
  .quote{margin:0;max-width:780px}
  .quote p{font-size:1.35rem;line-height:1.4;font-weight:700;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
  @media(max-width:820px){.quote p{font-size:1.12rem}}
  .quote cite{font-style:normal;font-size:.85rem;color:var(--lime);font-weight:700}
  .asks{display:flex;flex-direction:column;gap:8px;max-width:540px;margin:18px auto 0}
  .ask{font-size:.9rem;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin:0}
  .sharebox{margin-top:26px;padding-top:24px;border-top:1px solid var(--line)}
  .sharetitle{display:block;font-size:.7rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--green);margin-bottom:10px}
  .sharemsg{font-size:.86rem;color:#374b40;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:560px;margin:0 auto 14px;line-height:1.5}

  @media (prefers-color-scheme: dark){
    :root{--ink:#eaf3ec;--muted:#9db3a4;--line:#25382e;--card:#132420;--bg:#0b1611;--bg2:#0f1d16}
    body{background:radial-gradient(120% 60% at 50% -5%, rgba(31,157,85,.16), transparent 60%),var(--bg)}
    .lead,.contact p,.tech .body,.sharemsg{color:#c3d3c8}
    .screen{background:#0e1b14;color:#eaf3ec}
    .ptabs button[aria-selected="true"]{background:#1c3327}
    .order,.pfield input,.pnote{background:#132420}
  }
</style>
</head>
<body>

<div class="top">
  <div class="brand">
    <span class="mark" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21V9" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M12 9C12 9 8 4 3 6c3-4 9-2 9 3Z" fill="#7CE49B"/><path d="M12 9C12 9 16 4 21 6c-3-4-9-2-9 3Z" fill="#fff"/><path d="M12 9C12 9 6 8 5 13c4-3 7-1 7 1Z" fill="#7CE49B"/><path d="M12 9C12 9 18 8 19 13c-4-3-7-1-7 1Z" fill="#fff"/></svg>
    </span>
    <span><b>Pase Rápido</b><small>PROPUESTA</small></span>
  </div>
  <span class="sp"></span>
  <span class="disc" data-i18n="disc"></span>
  <div class="lang" role="group" aria-label="Idioma">
    <button data-lang="es" aria-pressed="true">ES</button>
    <button data-lang="en" aria-pressed="false">EN</button>
  </div>
</div>

<main class="wrap">
  <!-- HERO -->
  <div class="hero">
    <div class="herocopy">
      <div class="eyebrow" data-i18n="hero.eyebrow"></div>
      <p class="context" data-i18n="hero.context"></p>
      <h1 data-i18n="hero.h1"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="stat" data-i18n="hero.stat"></div>
      <span class="hint" data-i18n="hero.hint"></span>
      <p class="notproduct" data-i18n="hero.notproduct"></p>
    </div>
    <div class="herophone">
      <div class="phone">
        <div class="screen">
          <div class="statusbar"><span id="sbclock">9:41</span><span class="d"><span></span><span></span><span></span></span></div>
          <div class="appbar">
            <span class="mark" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 21V9" stroke="#fff" stroke-width="2" stroke-linecap="round"/><path d="M12 9C12 9 8 4 3 6c3-4 9-2 9 3Z" fill="#7CE49B"/><path d="M12 9C12 9 16 4 21 6c-3-4-9-2-9 3Z" fill="#fff"/><path d="M12 9C12 9 6 8 5 13c4-3 7-1 7 1Z" fill="#7CE49B"/><path d="M12 9C12 9 18 8 19 13c-4-3-7-1-7 1Z" fill="#fff"/></svg></span>
            <span><b>PUNTACANA</b><small>GRUPO</small></span>
          </div>
          <div class="ptabs" role="tablist">
            <button role="tab" aria-selected="true" data-pview="res" data-i18n="phone.tabRes"></button>
            <button role="tab" aria-selected="false" data-pview="gua" data-i18n="phone.tabGua"></button>
          </div>
          <div class="pview active" data-pview="res">
            <div><div class="pk" data-i18n="phone.res.k"></div><h3 class="ph" data-i18n="phone.res.h"></h3></div>
            <div id="r-idle">
              <div class="order"><span class="ic">🛵</span><div><b data-i18n="phone.res.orderT"></b><span data-i18n="phone.res.orderS"></span></div></div>
              <div class="pfield" style="margin-top:12px">
                <label for="cphone" data-i18n-html="phone.res.phoneLabel"></label>
                <input id="cphone" type="tel" inputmode="tel" data-i18n-attr="placeholder|phone.res.phonePh">
              </div>
              <p class="psub" style="margin:12px 0" data-i18n="phone.res.tip"></p>
              <button class="pbtn primary" id="activar" data-i18n="phone.res.activate"></button>
            </div>
            <div id="r-live" hidden></div>
            <div class="psp"></div>
            <p class="pnote" id="r-note" data-i18n-html="phone.res.note"></p>
          </div>
          <div class="pview" data-pview="gua">
            <div><div class="pk" data-i18n="phone.gua.k"></div><h3 class="ph" data-i18n="phone.gua.h"></h3></div>
            <p class="psub" data-i18n="phone.gua.sub"></p>
            <div id="g-console"></div>
            <p class="pnote" data-i18n-html="phone.gua.note"></p>
            <div class="psp"></div>
          </div>
        </div>
      </div>
    </div>

      document.querySelectorAll('[data-code]').forEach(function(e){e.textContent=codeStr();});
      document.querySelectorAll('[data-clock]').forEach(function(e){e.textContent=nowStr();});
    },1000);
  }
  function renderConsole(){
    var el=document.getElementById('g-console');if(!el)return;var g=tt("phone.gua");
    if(active){el.innerHTML='<div class="order"><span class="ic">🛵</span><div><b>Los Laureles 9</b><span>'+g.consoleType+'</span></div><span class="pill">● '+g.live+' · <span data-time>'+fmt(left)+'</span></span></div>';}
    else{el.innerHTML='<div class="pnote" style="text-align:center">'+g.empty+'</div>';}
  }

  function buildSteps(){
    var c=tt("cmp");
    var ot="";c.today.forEach(function(s){ot+='<li><div class="stx">'+s.x+(s.w?'<em class="warn">'+s.w+'</em>':'')+'</div><span class="t">'+s.t+'</span></li>';});
    document.getElementById('steps-today').innerHTML=ot;
    var nt="";c.neu.forEach(function(s){nt+='<li><div class="stx">'+s.x+(s.o?'<em class="ok2">'+s.o+'</em>':'')+'</div><span class="t">'+s.t+'</span></li>';});
    document.getElementById('steps-new').innerHTML=nt;
  }
  function buildCards(){var s=tt("safe").cards,h="";s.forEach(function(c){h+='<div class="scard"><div class="em">'+c.e+'</div><h3>'+c.h+'</h3><p>'+c.p+'</p></div>';});document.getElementById('safe-cards').innerHTML=h;}
  function buildTech(){var it=tt("tech").items,h="";it.forEach(function(t){h+='<details><summary>'+t.q+'</summary><div class="body">'+t.a+'</div></details>';});document.getElementById('tech-list').innerHTML=h;}
  function buildBiz(){var it=tt("biz").items,h="";it.forEach(function(c){h+='<div class="scard"><div class="em">'+c.e+'</div><h3>'+c.h+'</h3><p>'+c.p+'</p></div>';});var el=document.getElementById('biz-cards');if(el)el.innerHTML=h;}
  function refreshShare(){var m=document.getElementById('share-msg');if(m)m.textContent=tt("share.suggested");}

  function applyLang(){
    document.documentElement.lang=LANG;
    document.querySelectorAll('[data-i18n]').forEach(function(e){var v=tt(e.getAttribute('data-i18n'));if(v!=null)e.textContent=v;});
    document.querySelectorAll('[data-i18n-html]').forEach(function(e){var v=tt(e.getAttribute('data-i18n-html'));if(v!=null)e.innerHTML=v;});
    document.querySelectorAll('[data-i18n-attr]').forEach(function(e){var a=e.getAttribute('data-i18n-attr').split('|');var v=tt(a[1]);if(v!=null)e.setAttribute(a[0],v);});
    document.querySelectorAll('.lang button').forEach(function(b){b.setAttribute('aria-pressed', b.dataset.lang===LANG);});
    buildSteps();buildCards();buildTech();buildBiz();refreshShare();
    if(active)renderLive();else renderConsole();
    renderConsole();
  }

  // interactions
  document.getElementById('activar').onclick=activate;

  // share
  var waB=document.getElementById('wa-share');if(waB)waB.onclick=function(){window.open('https://wa.me/?text='+encodeURIComponent(tt("share.suggested")),'_blank');};
  var cpB=document.getElementById('copy-msg');if(cpB)cpB.onclick=function(){var t=tt("share.suggested");try{navigator.clipboard.writeText(t);}catch(e){}this.textContent=tt("share.copied");};

  // auto-play the pass for viewers who don't tap (#13); cancel if they start typing the phone
  var autoTimer=setTimeout(function(){if(!active)activate();},2600);
  var ciF=document.getElementById('cphone');if(ciF)ciF.addEventListener('focus',function(){clearTimeout(autoTimer);});
  document.querySelectorAll('.ptabs button').forEach(function(b){
    b.onclick=function(){document.querySelectorAll('.ptabs button').forEach(function(x){x.setAttribute('aria-selected','false');});b.setAttribute('aria-selected','true');
      phoneView=b.dataset.pview;document.querySelectorAll('.pview').forEach(function(v){v.classList.toggle('active',v.dataset.pview===phoneView);});renderConsole();};
  });
  document.querySelectorAll('.lang button').forEach(function(b){b.onclick=function(){LANG=b.dataset.lang;applyLang();};});

  // Swish drag sparkles
  var lastSpark=0;
  function spark(pass,x,y){var b=document.createElement('b');b.className='trail';b.style.left=x+'px';b.style.top=y+'px';pass.appendChild(b);setTimeout(function(){b.remove();},700);}
  function move(cx,cy,tg){var pass=tg&&tg.closest?tg.closest('.pass'):null;if(!pass||pass.classList.contains('dead'))return;var n=Date.now();if(n-lastSpark<35)return;lastSpark=n;var r=pass.getBoundingClientRect();spark(pass,cx-r.left,cy-r.top);}
  document.addEventListener('pointermove',function(e){move(e.clientX,e.clientY,e.target);});
  document.addEventListener('touchmove',function(e){var t=e.touches[0];if(t)move(t.clientX,t.clientY,document.elementFromPoint(t.clientX,t.clientY));},{passive:true});

  // clocks
  setInterval(function(){var t=nowStr();document.querySelectorAll('[data-clock]').forEach(function(e){e.textContent=t;});var d=new Date();document.getElementById('sbclock').textContent=d.getHours()+':'+String(d.getMinutes()).padStart(2,'0');},1000);

  // optional ?ig= override for the Instagram handle
  try{var q=new URLSearchParams(location.search).get('ig');if(q)IG=q;}catch(e){}
  if(IG){var il=document.getElementById('ig-link');il.href='https://instagram.com/'+IG.replace(/^@/,'');il.innerHTML='◉ @'+IG.replace(/^@/,'');}

  applyLang();
})();
</script>
