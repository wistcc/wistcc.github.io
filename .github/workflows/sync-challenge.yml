name: Sync challenge

# Daily, automatic, no AI:
#  - adds new Instagram Reels as episodes (needs the IG_TOKEN secret)
#  - reads the two numbers from a published Google Sheet (needs the NUMBERS_CSV_URL variable)
#  - forces a Pages rebuild so "Día N" changes at midnight (Dominican Republic time)
# Missing secrets/variables just skip that step. See .github/AUTOMATION.md.

on:
  schedule:
    - cron: '5 4 * * *'    # 00:05 RD: new day + catch anything posted late
    - cron: '0 20 * * *'   # 16:00 RD: after the usual afternoon Reel
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-challenge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Tests
        run: node --test .github/scripts/test/sync.test.mjs

      - name: Sync Instagram Reels
        id: ig
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          # refresh the token only in the midnight run (extends its 60-day life)
          IG_REFRESH: ${{ github.event.schedule == '5 4 * * *' && secrets.GH_PAT != '' && '1' || '0' }}
          IG_NEW_TOKEN_FILE: ${{ runner.temp }}/ig-token
        run: node .github/scripts/sync-instagram.mjs

      - name: Save refreshed Instagram token
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          if [ -s "$RUNNER_TEMP/ig-token" ] && [ -n "$GH_TOKEN" ]; then
            gh secret set IG_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/ig-token"
            echo "IG_TOKEN secret updated."
          else
            echo "No refreshed token to save."
          fi

      - name: Sync numbers from the Sheet
        env:
          NUMBERS_CSV_URL: ${{ vars.NUMBERS_CSV_URL }}
        run: node .github/scripts/sync-numbers.mjs

      - name: Validate challenge.yml
        run: |
          ruby -ryaml -rdate -e '
            d = YAML.safe_load(File.read("_data/challenge.yml"), permitted_classes: [Date])
            abort "days is empty" if d["days"].to_a.empty?
            d["days"].each do |e|
              abort "bad day entry: #{e.inspect}" unless e["day"].is_a?(Integer) && e.dig("title", "es").to_s != "" && e["instagram_url"].to_s.start_with?("https://www.instagram.com/")
            end
            abort "bad numbers" unless d["config"]["total_generated"].is_a?(Numeric) && d["config"]["monthly_income"].is_a?(Numeric)
            puts "challenge.yml OK (#{d["days"].size} episodes)"
          '

      - name: Commit and publish
        id: commit
        run: |
          git config user.name  "challenge-sync[bot]"
          git config user.email "challenge-sync[bot]@users.noreply.github.com"
          git add _data/challenge.yml assets/images/challenge
          if git diff --cached --quiet; then
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "Nothing to commit."
          else
            git commit -m "chore(challenge): automatic sync"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push already rebuilds Pages. With no changes we still rebuild so the day counter advances.
      - name: Rebuild Pages
        if: steps.commit.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds"
